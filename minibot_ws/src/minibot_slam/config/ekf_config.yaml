ekf_filter_node:
  ros__parameters:


    # Filter Settings
    frequency: 50.0
    sensor_timeout: 0.5
    two_d_mode: true

    publish_tf: true
    print_diagnostics: true
    debug: false



    # Coordinate Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link

    # Publish odom -> base_link
    world_frame: odom


    # Visual-Inertial Odometry (ZED2i), imu data already fused by zedsdk.
    odom0: /zed/zed_node/odom

    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]


    # Wheel Odometry
    odom1: /wheel/odom

    odom1_config: [
      true,  true,  false,
      false, false, true,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]

 
    
    
    # imu0: /zed/zed_node/imu/data

    # imu0_config: [
    #   false, false, false,
    #   false, false, true,
    #   false, false, false,
    #   false, false, true,
    #   false, false, false
    # ]

    # imu0_remove_gravitational_acceleration: true

 
    # Time
    use_sim_time: false
    
    
