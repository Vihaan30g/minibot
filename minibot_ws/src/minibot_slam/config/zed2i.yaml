/zed/zed_node:
  ros__parameters:
    # General parameters
    general:
      camera_model: zed2i
      base_frame: base_link                 # must match the URDF frame_id -- correct, keep
      # grab_frame_rate: 15

    # Positional Tracking - Core odometry settings
    pos_tracking:
      pos_tracking_enabled: true
      publish_tf: false                     # correct: EKF owns odom -> base_link, not this node

    # Depth settings
    depth:
      min_depth: 0.3
      max_depth: 5.0

    sensors:
      # NOTE: with publish_urdf:=true (set in zed.launch.py) the ZED wrapper's
      # own robot_state_publisher already publishes the camera->imu static TF
      # from calibrated SDK extrinsics. This flag is a *separate* legacy path
      # for broadcasting that same edge without the URDF. Having both active
      # can double-publish zed_camera_link -> zed_imu_link. If you see
      # TF_REPEATED_DATA warnings for that frame, set this to false.
      publish_imu_tf: true