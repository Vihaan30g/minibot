ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    
    # Only use odometry (no IMU for now)
    odom0: /zed/zed_node/odom
    odom0_config: [true, true, true, true, true, true,
                   false, false, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    
    # Disable IMU temporarily
    # imu0: /zed/zed_node/imu/data
    # imu0_config: [false, false, false, false, false, false,
    #               false, false, false, false, false, false,
    #               false, false, false]